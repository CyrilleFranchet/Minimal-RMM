---
services:
  rmm-control:
    build: .
    environment:
      RMM_API_TOKEN: ${RMM_API_TOKEN:?set RMM_API_TOKEN}
      RMM_BEACON_SECRET: ${RMM_BEACON_SECRET:?set RMM_BEACON_SECRET}
      RMM_WORKSPACES: ${RMM_WORKSPACES:?set RMM_WORKSPACES}
      RMM_STORAGE_MODE: ${RMM_STORAGE_MODE:-workspace}
      RMM_PLUGINS_DIR: /app/plugins
      RMM_PROFILES_DIR: /app/profiles
      RMM_PROFILE_NAME: ${RMM_PROFILE_NAME:-cloudflared}
      RMM_PROFILE_AUTOSTART: ${RMM_PROFILE_AUTOSTART:-1}
      RMM_ASSET_MAX_BYTES: ${RMM_ASSET_MAX_BYTES:-67108864}
      RMM_ADMIN_PORT: 8080
      RMM_BEACON_PORT: 8081
    command:
      - python3
      - server_rmm.py
      - --admin-port
      - "8080"
      - --beacon-port
      - "8081"
      - --bind
      - 0.0.0.0
      - --beacon-bind
      - 0.0.0.0
    ports:
      - "${RMM_ADMIN_PORT:-8080}:8080"
      - "${RMM_BEACON_PORT:-8081}:8081"
    volumes:
      - rmm-control-state:/app/RMM_logs
      - ${RMM_PROFILE_STORE:-rmm-profile-store}:/app/profiles
      # Use the named volume by default. Set RMM_PLUGIN_STORE to a host path
      # when operators need to copy new artifacts into it directly.
      - ${RMM_PLUGIN_STORE:-rmm-plugin-store}:/app/plugins
    networks:
      - rmm-control
    restart: unless-stopped

  workspace:
    build: .
    profiles: ["workspace"]
    depends_on:
      - rmm-control
    environment:
      RMM_C2_URL: http://rmm-control:8080
      RMM_WORKSPACE_ID: ${RMM_WORKSPACE_ID:?set RMM_WORKSPACE_ID}
      RMM_WORKSPACE_TOKEN: ${RMM_WORKSPACE_TOKEN:?set RMM_WORKSPACE_TOKEN}
      RMM_WORKSPACE_LOCAL_TOKEN: >-
        ${RMM_WORKSPACE_LOCAL_TOKEN:?set RMM_WORKSPACE_LOCAL_TOKEN}
      RMM_WORKSPACE_DATA: /workspace/data
      RMM_WORKSPACE_BIND: 0.0.0.0
      RMM_WORKSPACE_PORT: 8787
      RMM_WORKSPACE_TUN_HELPER: /app/tools/rmm-tun
      RMM_RCLONE_PROFILES_FILE: >-
        ${RMM_RCLONE_PROFILES_FILE:-/workspace/rclone/profiles.json}
      RMM_RCLONE_PROFILES: ${RMM_RCLONE_PROFILES:-}
      RMM_RCLONE_DEFAULT_PROFILE: ${RMM_RCLONE_DEFAULT_PROFILE:-mega-lab}
      RMM_RCLONE_MAX_BYTES: ${RMM_RCLONE_MAX_BYTES:-100000000}
    command: ["python3", "workspace_service.py"]
    ports:
      - "${RMM_WORKSPACE_PORT:-8787}:8787"
    volumes:
      - rmm-workspace-data:/workspace/data
      - ./tools/rclone:/workspace/rclone:ro
    devices:
      - "/dev/net/tun:/dev/net/tun"
    cap_add:
      - NET_ADMIN
    networks:
      - rmm-control
    restart: unless-stopped

volumes:
  rmm-control-state:
  rmm-plugin-store:
  rmm-profile-store:
  rmm-workspace-data:

networks:
  rmm-control:
