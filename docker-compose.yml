---
services:
  rmm-control:
    build: .
    stop_grace_period: 45s
    # Operational settings live in /app/RMM_logs/settings.json.
    # Nonempty legacy secrets below explicitly override saved configuration.
    environment:
      RMM_API_TOKEN: ${RMM_API_TOKEN:-}
      RMM_BEACON_SECRET: ${RMM_BEACON_SECRET:-}
      RMM_WORKSPACES: ${RMM_WORKSPACES:-}
      RMM_STORAGE_MODE: ${RMM_STORAGE_MODE:-workspace}
      RMM_PLUGINS_DIR: /app/plugins
      RMM_PROFILES_DIR: /app/profiles
      RMM_PLUGIN_GITHUB_TOKEN: ${RMM_SERVER_PLUGIN_GITHUB_TOKEN:-}
      RMM_ADMIN_PORT: 8080
      RMM_BEACON_PORT: 8081
    command:
      - python3
      - server_rmm.py
      - --admin-port
      - "8080"
      - --beacon-port
      - "8081"
      - --bind
      - 0.0.0.0
      - --beacon-bind
      - 0.0.0.0
    ports:
      - "${RMM_ADMIN_PORT:-8080}:8080"
      - "${RMM_BEACON_PORT:-8081}:8081"
    volumes:
      - rmm-control-state:/app/RMM_logs
      - ${RMM_PROFILE_STORE:-rmm-profile-store}:/app/profiles
      # Use the named volume by default. Set RMM_PLUGIN_STORE to a host path
      # when operators need to copy new artifacts into it directly.
      - ${RMM_PLUGIN_STORE:-rmm-plugin-store}:/app/plugins
    networks:
      - rmm-control
    restart: unless-stopped

  workspace:
    build: .
    stop_grace_period: 45s
    profiles: ["workspace"]
    depends_on:
      - rmm-control
    environment:
      RMM_C2_URL: ${RMM_C2_URL:-}
      RMM_WORKSPACE_ID: ${RMM_WORKSPACE_ID:-}
      RMM_WORKSPACE_TOKEN: ${RMM_WORKSPACE_TOKEN:-}
      RMM_WORKSPACE_LOCAL_TOKEN: >-
        ${RMM_WORKSPACE_LOCAL_TOKEN:-}
      RMM_WORKSPACE_DATA: /workspace/data
      RMM_PLUGIN_GITHUB_TOKEN: ${RMM_WORKSPACE_PLUGIN_GITHUB_TOKEN:-}
      RMM_WORKSPACE_BIND: 0.0.0.0
      RMM_WORKSPACE_PORT: 8787
      RMM_WORKSPACE_TUN_HELPER: /app/tools/rmm-tun
    command: ["python3", "workspace_service.py"]
    ports:
      - "${RMM_WORKSPACE_PORT:-8787}:8787"
    volumes:
      - rmm-workspace-data:/workspace/data
      - ./tools/rclone:/workspace/rclone:ro
    devices:
      - "/dev/net/tun:/dev/net/tun"
    cap_add:
      - NET_ADMIN
    networks:
      - rmm-control
    restart: unless-stopped

volumes:
  rmm-control-state:
  rmm-plugin-store:
  rmm-profile-store:
  rmm-workspace-data:

networks:
  rmm-control:
