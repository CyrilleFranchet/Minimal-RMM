---
name: Windows agent identity

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent-go/**'
      - '.github/workflows/windows-agent-identity.yml'
  push:
    branches: [main, v2]
    paths:
      - 'agent-go/**'
      - '.github/workflows/windows-agent-identity.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-go/go.mod
          cache: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Build the dedicated service and standalone launcher
        working-directory: agent-go
        shell: cmd
        run: |
          cl /nologo /std:c11 /O1 lateral-service\c\service.c ^
            /link /OUT:..\lateral-service-test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /O1 stage1\c\stage1.c ^
            /link /OUT:..\stage1-test.exe
      - name: Verify SCM is confined to the dedicated service
        shell: pwsh
        run: |
          $standalone = dumpbin /imports stage1-test.exe | Out-String
          $service = dumpbin /imports lateral-service-test.exe | Out-String
          $apis = 'StartServiceCtrlDispatcherW',
            'RegisterServiceCtrlHandlerW', 'SetServiceStatus'
          foreach ($api in $apis) {
            if ($standalone.Contains($api) -or !$service.Contains($api)) {
              throw "Incorrect service boundary: $api"
            }
          }
      - name: Test the native service handshake and caller-owned cleanup
        working-directory: agent-go
        shell: pwsh
        run: |
          $exe = (Resolve-Path ../lateral-service-test.exe).Path
          $env:RMM_LATERAL_SERVICE_TEST_EXE = $exe
          go test -buildvcs=false -count=1 -v `
            -run TestDedicatedLateralServiceProtocol .
      - name: Test callback isolation, token revocation, and spawn dispatch
        working-directory: agent-go
        shell: pwsh
        run: |
          $tests = 'Test(Callback|ExplicitRev2self|IdentityBoundary'
          $tests += '|ServerRequest|SpawnUsesOnlyCreateProcessA'
          $tests += '|WindowsDetachedSpawn|WindowsExplicitLogonHasNoFallback'
          $tests += '|WindowsRunasOutputLifecycle'
          $tests += '|WindowsLogonCredentialEncoding)'
          go test -buildvcs=false -count=1 -v -run $tests .
