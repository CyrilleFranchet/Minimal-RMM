---
name: Windows agent identity

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent-go/**'
      - '.github/workflows/windows-agent-identity.yml'
  push:
    branches: [main, v2]
    paths:
      - 'agent-go/**'
      - '.github/workflows/windows-agent-identity.yml'

permissions:
  contents: read

jobs:
  debug-diagnostics:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.21.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Test normal and debug artifact boundaries and diagnostics
        working-directory: agent-go
        shell: pwsh
        run: |
          $tests = '^Test(Debug|SpawnasDebug|SpawnDebug|LateralDebug'
          $tests += '|LateralThread'
          $tests += '|SpawnEnvironment'
          $tests += '|NormalBuild|WinRMDetach'
          $tests += '|WMIAuthentication|WMICreateProcess)'
          go test -buildvcs=false -count=1 -v -tags= -run $tests .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -buildvcs=false -count=1 -v -tags=rmmdebug -run $tests .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  identity:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-go/go.mod
          cache: false
      - name: Test CMD command quoting
        working-directory: agent-go
        shell: pwsh
        run: |
          go test -buildvcs=false -count=1 -v `
            -run '^TestWindowsCMDQuotedCommands$' .
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Check WinRM layouts against the Windows SDK
        working-directory: agent-go
        shell: cmd
        run: |
          cl /nologo /TP /std:c++17 /W4 /WX /c testdata\wsman_layout.c ^
            /Fo..\wsman-layout.obj
      - name: Test local WinRM bindings and callback lifecycle
        working-directory: agent-go
        shell: pwsh
        run: |
          go test -buildvcs=false -count=1 -v -run '^TestWSMan' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -buildvcs=false -count=1 -v -tags=rmmdebug -run '^TestWSMan' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the dedicated service and standalone launcher
        working-directory: agent-go
        shell: cmd
        run: |
          cl /nologo /std:c11 /O1 lateral-service\c\service.c ^
            /link /OUT:..\lateral-service-test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /O1 stage1\c\stage1.c ^
            /link /OUT:..\stage1-test.exe
      - name: Verify SCM is confined to the dedicated service
        shell: pwsh
        run: |
          $standalone = dumpbin /imports stage1-test.exe | Out-String
          $service = dumpbin /imports lateral-service-test.exe | Out-String
          $apis = 'StartServiceCtrlDispatcherW',
            'RegisterServiceCtrlHandlerW', 'SetServiceStatus'
          foreach ($api in $apis) {
            if ($standalone.Contains($api) -or !$service.Contains($api)) {
              throw "Incorrect service boundary: $api"
            }
          }
      - name: Test the native service handshake and caller-owned cleanup
        working-directory: agent-go
        shell: pwsh
        run: |
          $exe = (Resolve-Path ../lateral-service-test.exe).Path
          $env:RMM_LATERAL_SERVICE_TEST_EXE = $exe
          go test -buildvcs=false -count=1 -v `
            -run 'Test(DedicatedLateralServiceProtocol|WindowsSCMProcedures)' .
      - name: Test callback isolation, token revocation, and spawn dispatch
        working-directory: agent-go
        shell: pwsh
        run: |
          $tests = 'Test(Callback|ExplicitRev2self|IdentityBoundary'
          $tests += '|ServerRequest|SpawnUsesOnlyCreateProcessA'
          $tests += '|WindowsDetachedSpawn|WindowsExplicitLogonHasNoFallback'
          $tests += '|WindowsRunasOutputLifecycle'
          $tests += '|RunasOutputSnapshot'
          $tests += '|WindowsLogonCredentialEncoding'
          $tests += '|WindowsRegistration)'
          go test -buildvcs=false -count=1 -v -run $tests .
